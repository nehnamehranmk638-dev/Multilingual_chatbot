<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IIITK Admission Chatbot</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 6px 0; }
    .user { text-align: right; color: #0b5; }
    .bot { text-align: left; color: #333; }
    #input-row { display: flex; gap: 8px; }
    #message-input { flex: 1; padding: 8px; }
  </style>
</head>
<body>
  <h2>IIITK Admission Chatbot</h2>
  <div id="chat-box"></div>
  <div id="input-row">
    <input type="text" id="message-input" placeholder="Ask something..." />
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';

      try {
        const response = await fetch('http://127.0.0.1:8000/api/chat/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        addMessage(data.answer, 'bot');
      } catch (err) {
        addMessage('Error: could not reach server.', 'bot');
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
